spring:
  application:
    name: interview-beater-service
  lifecycle:
    timeout-per-shutdown-phase: 30s   # сколько ждать незавершенные запросы (максимум)
  info:
    env:
      enabled: true
    build:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/interviewBeaterService
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 250MB

logging:
  level:
    com.github.interviewbeaterservice: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    description: Interview Beater Service - REST API for interview preparation
    version: 0.0.1-SNAPSHOT
    java: ${java.version}
  developer:
    name: InterviewBeater Team

jwt:
  secret: some-secret-some-secret-some-secret
  ttl: PT1H # Время жизни токена - 1 час

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:interview-attachments}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:20971520}    # 20 MiB
  max-files-per-upload: ${STORAGE_MAX_FILES:10}
  allowed-content-types: ${STORAGE_ALLOWED_TYPES:image/png,image/jpeg,image/webp,application/pdf,text/plain}
  presigned-url-ttl: ${STORAGE_PRESIGNED_TTL:PT15M}