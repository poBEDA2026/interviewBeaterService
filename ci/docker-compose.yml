services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: interviewbeater-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewbeater}
      POSTGRES_USER: ${POSTGRES_USER:-interviewbeater}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewbeater_dev_password}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      LANG: C.UTF-8
      PGDATA: /var/lib/postgresql/data/pgdata/pgdata
#    volumes:
#       - postgres_data:/var/lib/postgresql/data
#      - ../src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewbeater -d interviewbeater"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - interviewbeater-network

  # Redis Cache (for later stages)
  redis:
    image: redis:7-alpine
    container_name: interviewbeater-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - interviewbeater-network

  # Application
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: interviewbeater-app
    volumes:
      - ../ci/application-docker.yml:/app/config/application-docker.yml:ro
    environment:
      SPRING_CONFIG_LOCATION: classpath:/,file:/app/config/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-interviewbeater}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-interviewbeater}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-interviewbeater_dev_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -Xms512m -Xmx1024m}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      DB_SHOW_SQL: ${DB_SHOW_SQL:-false}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-DEBUG}
      LOG_LEVEL_WEB: ${LOG_LEVEL_WEB:-INFO}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-INFO}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOG_LEVEL_SECURITY:-DEBUG}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:${MINIO_PORT:-9000}}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-interview-attachments}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-20971520}
      STORAGE_MAX_FILES: ${STORAGE_MAX_FILES:-10}
      STORAGE_ALLOWED_TYPES: ${STORAGE_ALLOWED_TYPES:-image/png,image/jpeg,image/webp,application/pdf,text/plain}
      STORAGE_PRESIGNED_TTL: ${STORAGE_PRESIGNED_TTL:-PT15M}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - interviewbeater-network

  # MinIO — S3-совместимое хранилище для вложений
  # Примечание: официальный образ quay.io/minio/minio недоступен через корпоративный прокси,
  # поэтому используется зеркало ghcr.io/coollabsio/minio (локальная разработка).
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:latest}
    container_name: interviewbeater-minio
    command: server /data --address ":${MINIO_PORT:-9000}" --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # curl отсутствует в образе ghcr.io/coollabsio/minio, поэтому проверка через mc
      test: ["CMD-SHELL", "mc alias set local http://localhost:${MINIO_PORT:-9000} $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewbeater-network

  # One-shot init: создаёт бакет, если его ещё нет.
  # S3BucketInitializer в коде тоже создаёт бакет идемпотентно — это резерв.
  # Образ тот же, что у minio: в нём есть /bin/sh и mc, а отдельный quay.io/minio/mc
  # недоступен через корпоративный прокси.
  minio-init:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    # Переопределяем entrypoint образа (иначе стартует minio-сервер) на /bin/sh.
    # Креды и бакет берём из env — те же переменные, что у minio и приложения.
    entrypoint: []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-interview-attachments}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:${MINIO_PORT:-9000}}
    command: ["/bin/sh", "-c", "mc alias set local \"$$STORAGE_ENDPOINT\" \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing \"local/$$STORAGE_BUCKET\" && exit 0"]
    networks:
      - interviewbeater-network

# volumes:
#   postgres_data:
#     driver: local
volumes:
  minio_data:

networks:
  interviewbeater-network:
    driver: bridge