on:
  pull_request:
  workflow_dispatch:

# Отменяем предыдущие прогоны на тот же PR, чтобы не тратить минуты runner'а
# на устаревшие коммиты после push -f.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B test #Флаг -B нужен, чтобы убрать интервактивные промпты и цветовые коды для читаемости лога
        # mvn сам подтянет кэш ~/.m2 (см. cache: maven выше),
        # поэтому отдельный шаг с restore-keys не нужен.

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

